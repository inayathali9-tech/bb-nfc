<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leave a review</title>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;font-family:system-ui,sans-serif;color:#fff;background:#05070f}
canvas{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:28px 18px 40px;text-align:center}
.logo{width:92px;height:92px;border-radius:50%;object-fit:cover;border:2px solid #ffffff55;margin-bottom:12px;display:none}
h1{font-size:1.5rem}
.sub{opacity:.75;margin:8px 0 20px;font-size:.95rem}
.p{display:block;width:100%;margin:10px 0;padding:14px 16px;border-radius:14px;border:1px solid #ffffff33;background:#ffffff14;backdrop-filter:blur(6px);color:#fff;font-size:1rem;text-align:left;cursor:pointer;font-family:inherit}
.p:active{background:#ffffff30}
.row{display:flex;gap:10px;margin-top:22px}
.row a{flex:1;padding:13px;border-radius:14px;color:#fff;text-decoration:none;font-weight:600}
.ig{background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)}
.wa{background:#25d366}
.foot{margin-top:34px;padding-top:18px;border-top:1px solid #ffffff22;font-size:.85rem;opacity:.85;line-height:1.7}
.foot b{display:block;font-size:.95rem;margin-bottom:4px}
.foot a{color:#9cf;text-decoration:none}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#fff;color:#111;padding:12px 18px;border-radius:30px;font-weight:600;opacity:0;transition:.3s;z-index:5;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="wrap">
  <img id="logo" class="logo" alt="">
  <h1 id="title">Loading…</h1>
  <p id="sub" class="sub"></p>
  <div id="prompts"></div>
  <div class="row" id="links"></div>
  <div class="foot">
    <b>Want an NFC review card for your shop?</b>
    Contact Brand Boost Studio<br>
    <a href="mailto:brandbooststudio110@gmail.com">brandbooststudio110@gmail.com</a><br>
    <a href="tel:+918019314110">80193 14110</a>
  </div>
</div>
<div id="toast"></div>
<script>
// ---- starry background with shooting stars ----
const cv=document.getElementById('bg'),cx=cv.getContext('2d');
let W,H,stars=[],shots=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;
  stars=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.3,t:Math.random()*6}))}
addEventListener('resize',size);size();
function frame(){
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05070f');g.addColorStop(1,'#1a1040');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  stars.forEach(s=>{s.t+=.03;cx.globalAlpha=.5+.5*Math.sin(s.t);cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,7);cx.fill()});
  cx.globalAlpha=1;
  if(Math.random()<.02)shots.push({x:Math.random()*W*.8,y:Math.random()*H*.5,l:0});
  shots=shots.filter(s=>s.l<60);
  shots.forEach(s=>{s.l++;s.x+=9;s.y+=5;
    const gr=cx.createLinearGradient(s.x,s.y,s.x-90,s.y-50);
    gr.addColorStop(0,'#fff');gr.addColorStop(1,'transparent');
    cx.strokeStyle=gr;cx.lineWidth=2;cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x-90,s.y-50);cx.stroke()});
  requestAnimationFrame(frame)}
frame();

// ---- page logic ----
const $=id=>document.getElementById(id);
const code=new URLSearchParams(location.search).get('c');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000)}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}}
const ig=v=>/^https?:/.test(v)?v:'https://instagram.com/'+v.replace('@','');
const wa=v=>/^https?:/.test(v)?v:'https://wa.me/'+v.replace(/\D/g,'');
function add(t,c,h){const a=document.createElement('a');a.className=c;a.href=h;a.target='_blank';a.textContent=t;$('links').appendChild(a)}

fetch('shops.json?'+Date.now()).then(r=>r.json()).then(d=>{
  const s=(d.shops||{})[code];
  if(!s){
    $('title').textContent='This card is not set up yet';
    const a=document.createElement('a');a.href='admin.html?c='+encodeURIComponent(code||'');a.textContent='Owner setup';a.style.color='#9cf';
    $('sub').appendChild(a);return;
  }
  document.title=s.name;
  $('title').textContent=s.name;
  $('sub').textContent='Tap a line to copy it, then paste it as your review. Feel free to edit it!';
  if(s.logo){$('logo').src=s.logo;$('logo').style.display='inline-block'}
  (s.prompts&&s.prompts.length?s.prompts:(d.categories[s.category]||[])).forEach(p=>{
    const b=document.createElement('button');b.className='p';b.textContent=p;
    b.onclick=async()=>{await copy(p);toast('Copied! Paste it on Google ✨');if(s.google)setTimeout(()=>location.href=s.google,1300)};
    $('prompts').appendChild(b)});
  if(s.instagram)add('Instagram','ig',ig(s.instagram));
  if(s.whatsapp)add('WhatsApp','wa',wa(s.whatsapp));
}).catch(()=>{$('title').textContent='Could not load. Please try again.'});
</script>
</body>
</html>
